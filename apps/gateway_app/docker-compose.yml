version: '3.9'
services:
  gateway_app:
    container_name: gateway_app
    build:
      context: ../..
      dockerfile: apps/gateway_app/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - JWT_SECRET=${JWT_SECRET}
      - VL_LEARNING_DOMAIN=${VL_LEARNING_DOMAIN}
    restart: always