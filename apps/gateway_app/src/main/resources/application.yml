server:
  port: 8082

spring:
  cloud:
    gateway:
      routes:
        - id: users-route
          uri: http://localhost:8081
          predicates:
            - Path=/v1/users/**
          filters:
            - AuthenticationFilter
        - id: listenings-route
          uri: http://localhost:8000
          predicates:
            - Path=/v1/listenings/**
          filters:
            - AuthenticationFilter
        - id: descriptions-route
          uri: http://localhost:8000
          predicates:
            - Path=/v1/descriptions/**
          filters:
            - AuthenticationFilter
        - id: chats-route
          uri: http://localhost:8000
          predicates:
            - Path=/v1/chats/**
          filters:
            - AuthenticationFilter
        - id: descriptions-route
          uri: http://localhost:8000
          predicates:
            - Path=/v1/descriptions/**
          filters:
            - AuthenticationFilter
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true