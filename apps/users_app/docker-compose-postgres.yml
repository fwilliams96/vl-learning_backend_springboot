version: '3.9'
services:
  postgresql:
    image: postgres:13
    container_name: postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=users
    volumes:
      - postgresdata:/var/lib/postgresql/data
    restart: always

volumes:
  postgresdata:
